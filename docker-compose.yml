version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rex-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"}
      - JWT_EXPIRES_IN=12h
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rexagency.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required on first boot}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN is required - comma-separated allowed origins}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-rexagency0@gmail.com}
      - EXCEL_PATH=./dataset/leads.xlsx
    volumes:
      - ./backend/dataset:/app/dataset
      - uploads_data:/app/uploads
    networks:
      - rex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rex-frontend
    restart: unless-stopped
    ports:
      - '3001:80'
    depends_on:
      - backend
    networks:
      - rex-network

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: rex-admin
    restart: unless-stopped
    ports:
      - '3002:80'
    depends_on:
      - backend
    networks:
      - rex-network

volumes:
  uploads_data:

networks:
  rex-network:
    driver: bridge
